name: Check GTA 6 PC Release

on:
  schedule:
    # 01:00 MSK (UTC+3) -> 22:00 UTC previous day
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_yt:
        description: 'Force YouTube check (--yt)'
        required: false
        type: boolean
        default: false
      test_run:
        description: 'Send test message to Telegram (--test)'
        required: false
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GTA 6 checker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.test_run }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ github.event.inputs.force_yt }}" = "true" ]; then
            ARGS="$ARGS --yt"
          fi
          python check_gta6.py $ARGS
